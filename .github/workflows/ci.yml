name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  jvm:
    name: JVM ${{ matrix.java }}, Clojure ${{ matrix.clojure }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        java: ['17', '21', '25']
        clojure: ['1.10', '1.11', '1.12']
        include:
          - os: macos-latest
            java: '25'
            clojure: '1.12'
          - os: windows-latest
            java: '25'
            clojure: '1.12'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: DeLaGuardo/setup-clojure@13.7.0
        with:
          bb: latest
      - uses: actions/cache@v6
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
            ~/.deps.clj
          key: deps-${{ runner.os }}-${{ hashFiles('deps.edn') }}
      - run: bb test:jvm :${{ matrix.clojure }}

  babashka:
    name: babashka ${{ matrix.bb }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        bb: ['1.13.225', latest]
    steps:
      - uses: actions/checkout@v7
      - uses: DeLaGuardo/setup-clojure@13.7.0
        with:
          bb: ${{ matrix.bb }}
      - run: bb test

  # Against real servers: nREPL with cider-nrepl, which takes the Clojure CLI,
  # and babashka's.
  integration:
    name: Integration (bb ${{ matrix.task }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        task: ['test:integration', 'test:integration:jvm']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: DeLaGuardo/setup-clojure@13.7.0
        with:
          cli: latest
          bb: latest
      - uses: actions/cache@v6
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
            ~/.deps.clj
          key: integration-${{ runner.os }}-${{ hashFiles('deps.edn', 'src/neorepl/jack_in.clj') }}
          restore-keys: integration-${{ runner.os }}-
      - run: bb ${{ matrix.task }}

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: DeLaGuardo/setup-clojure@13.7.0
        with:
          clj-kondo: latest
      - run: clj-kondo --lint src test integration
